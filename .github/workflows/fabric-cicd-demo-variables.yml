name: Deploy via fabric-cicd

# Note this repository requires the below GitHub secrets configured:
# AZURE_CLIENT_ID - The Client ID of your User-Assigned Managed Identity.
# AZURE_TENANT_ID - Your Microsoft Entra tenant ID.
# AZURE_SUBSCRIPTION_ID - Your Azure Subscription ID.

# In addition, the below repository variables need to be configured:
# ItemsInScope - List of all items you want deployed. For this example, I opted for the below items in the below format:
#    "Notebook,Environment,Report,SemanticModel"
# DevWorkspace - GUID value of the dev workspace.
# TestWorkspace - GUID value of the test workspace.
# ProdWorkspace - GUID value of the production workspace. 

# Sets the trigger to manual run
on:
  workflow_dispatch:

# Specify ResourceUrl and items in scope
env:
  resourceUrl: https://api.fabric.microsoft.com

# Required permissions for GitHub OIDC token generation
permissions:
  id-token: write
  contents: read

jobs:
  # 1. Job to deploy to DEV via fabric-cicd
  'Deploy_to_Dev':
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: 3.11

      # Install fabric-cicd library
      - name: Install fabric-cicd library
        run: |
            python -m pip install --upgrade pip
            pip install fabric-cicd

      # Authenticate seamlessly using OIDC & User-Assigned Managed Identity
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetch the access token using native Azure CLI on Ubuntu
      - name: Fetch Fabric Access Token
        run: |
          fabricToken=$(az account get-access-token --resource ${{ env.resourceUrl }} --query accessToken -o tsv)
          echo "FABRIC_BEARER_TOKEN=$fabricToken" >> $GITHUB_ENV

      # Run script to deploy with fabric-cicd to Dev
      - name: Run script to deploy with fabric-cicd to Dev
        run: python auth_spn_secret_AzDo.py --WorkspaceId ${{vars.DevWorkspace}} --Environment "Dev" --RepositoryDirectory "./workspace" --ItemsInScope ${{vars.ItemsInScope}}

  # 2. Job to deploy to TEST (Runs ONLY after Dev succeeds)
  'Deploy_to_Test':
    needs: Deploy_to_Dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: 3.11

      # Install fabric-cicd library
      - name: Install fabric-cicd library
        run: |
            python -m pip install --upgrade pip
            pip install fabric-cicd

      # Authenticate seamlessly using OIDC & User-Assigned Managed Identity
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetch the access token using native Azure CLI on Ubuntu
      - name: Fetch Fabric Access Token
        run: |
          fabricToken=$(az account get-access-token --resource ${{ env.resourceUrl }} --query accessToken -o tsv)
          echo "FABRIC_BEARER_TOKEN=$fabricToken" >> $GITHUB_ENV

      # Run script to deploy with fabric-cicd to Test
      - name: Run script to deploy with fabric-cicd to Test
        run: python auth_spn_secret_AzDo.py --WorkspaceId ${{vars.TestWorkspace}} --Environment "Test" --RepositoryDirectory "./workspace" --ItemsInScope ${{vars.ItemsInScope}}
          
  # 3. Job to deploy to PROD (Runs ONLY after Test succeeds)
  'Deploy_to_Prod':
    needs: Deploy_to_Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: 3.11

      # Install fabric-cicd library
      - name: Install fabric-cicd library
        run: |
            python -m pip install --upgrade pip
            pip install fabric-cicd

      # Authenticate seamlessly using OIDC & User-Assigned Managed Identity
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetch the access token using native Azure CLI on Ubuntu
      - name: Fetch Fabric Access Token
        run: |
          fabricToken=$(az account get-access-token --resource ${{ env.resourceUrl }} --query accessToken -o tsv)
          echo "FABRIC_BEARER_TOKEN=$fabricToken" >> $GITHUB_ENV

      # Run script to deploy with fabric-cicd to Prod
      - name: Run script to deploy with fabric-cicd to Prod
        run: python auth_spn_secret_AzDo.py --WorkspaceId ${{vars.ProdWorkspace}} --Environment "Prod" --RepositoryDirectory "./workspace" --ItemsInScope ${{vars.ItemsInScope}}
